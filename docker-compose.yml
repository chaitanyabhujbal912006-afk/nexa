services:
  nexa-ui:
    build:
      context: ./kb-agent
      dockerfile: Dockerfile
    container_name: nexa-ui
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX:-nexa-knowledge-base}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - NEXA_WEBHOOK_URL=${NEXA_WEBHOOK_URL:-}
    volumes:
      - ./kb-agent/data:/app/data
    restart: unless-stopped

  nexa-api:
    build:
      context: ./kb-agent
      dockerfile: Dockerfile
    container_name: nexa-api
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX:-nexa-knowledge-base}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-Nexa <onboarding@resend.dev>}
      - JWT_SECRET=${JWT_SECRET}
      - NEXA_API_KEY=${NEXA_API_KEY:-}
      - NEXA_ALLOWED_ORIGINS=${NEXA_ALLOWED_ORIGINS:-http://localhost:8501,http://localhost:3000}
      - NEXA_WEBHOOK_URL=${NEXA_WEBHOOK_URL:-}
    volumes:
      - ./kb-agent/data:/app/data
    restart: unless-stopped
