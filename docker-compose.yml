version: '3.8'

services:
  nexa-ui:
    build:
      context: ./kb-agent
      dockerfile: Dockerfile
    container_name: nexa-ui
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./kb-agent/data:/app/data
      - ./kb-agent/chroma_db:/app/chroma_db
    restart: unless-stopped

  nexa-api:
    build:
      context: ./kb-agent
      dockerfile: Dockerfile
    container_name: nexa-api
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./kb-agent/data:/app/data
      - ./kb-agent/chroma_db:/app/chroma_db
    restart: unless-stopped
