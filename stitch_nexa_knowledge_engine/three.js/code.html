<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 15;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// NEXA Central Core
const coreGeometry = new THREE.IcosahedronGeometry(2, 2);
const coreMaterial = new THREE.MeshPhongMaterial({ 
    color: 0x3b82f6, 
    emissive: 0x1d4ed8, 
    wireframe: true,
    transparent: true,
    opacity: 0.8
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
scene.add(core);

// Inner Core Glow
const innerCore = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.3 })
);
scene.add(innerCore);

// Rotating Rings
const ringGroup = new THREE.Group();
for(let i = 0; i < 3; i++) {
    const ringGeo = new THREE.TorusGeometry(3.5 + i * 1, 0.02, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.4 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.random() * Math.PI;
    ring.rotation.y = Math.random() * Math.PI;
    ringGroup.add(ring);
}
scene.add(ringGroup);

// Source Nodes (PDF, Email, etc.)
const nodes = [];
const nodeCount = 6;
for(let i = 0; i < nodeCount; i++) {
    const nodeGeo = new THREE.BoxGeometry(0.8, 1, 0.1);
    const nodeMat = new THREE.MeshPhongMaterial({ color: 0x1e293b, emissive: 0x0f172a });
    const node = new THREE.Mesh(nodeGeo, nodeMat);
    
    const angle = (i / nodeCount) * Math.PI * 2;
    node.position.set(Math.cos(angle) * 8, Math.sin(angle) * 8, 0);
    nodes.push(node);
    scene.add(node);
    
    // Connection lines (represented by thin meshes)
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        node.position
    ]);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.2 });
    const line = new THREE.Line(lineGeo, lineMat);
    scene.add(line);
}

const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0x3b82f6, 1, 50);
pointLight.position.set(0, 0, 10);
scene.add(pointLight);

function animate() {
    requestAnimationFrame(animate);
    core.rotation.y += 0.01;
    core.rotation.x += 0.005;
    ringGroup.children.forEach((ring, i) => {
        ring.rotation.z += 0.002 * (i + 1);
    });
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->
</body>
</html>
