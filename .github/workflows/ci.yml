name: Nexa CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'kb-agent/requirements.txt'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r kb-agent/requirements.txt

    - name: Syntax & Module Verification
      run: |
        python -c "import ast; ast.parse(open('kb-agent/app.py').read()); print('app.py OK')"
        python -c "import ast; ast.parse(open('kb-agent/rag_engine.py').read()); print('rag_engine.py OK')"
        python -c "import ast; ast.parse(open('kb-agent/api.py').read()); print('api.py OK')"

    - name: Run Sample PDF Generator & Ingestion
      working-directory: kb-agent
      env:
        PYTHONPATH: .
      run: |
        python generate_sample_pdfs.py
        python ingest.py

    - name: Run Pytest Suite
      working-directory: kb-agent
      env:
        PYTHONPATH: .
      run: |
        python -m pytest -v

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: |
        npm install

    - name: Build React/Vite Frontend
      working-directory: frontend
      run: |
        npm run build
