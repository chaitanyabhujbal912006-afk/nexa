name: Nexa CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r kb-agent/requirements.txt

    - name: Syntax & Lint Verification
      run: |
        python -c "import ast; ast.parse(open('kb-agent/app.py').read()); print('app.py OK')"
        python -c "import ast; ast.parse(open('kb-agent/rag_engine.py').read()); print('rag_engine.py OK')"
        python -c "import ast; ast.parse(open('kb-agent/api.py').read()); print('api.py OK')"

    - name: Run Ingestion Pipeline
      run: |
        cd kb-agent
        python generate_sample_pdfs.py
        python ingest.py

    - name: Run Test Suite
      run: |
        cd kb-agent
        pytest tests/
